<style>
/* RADAR V2 SHELL */
html { scroll-behavior:smooth; }
body { background:#f2f5f8 !important; }
.radar-shell-header { background:#17243b;color:#fff;padding:28px; }
.radar-shell-header h1 { margin:0 0 8px;font-size:34px; }
.radar-shell-header .sub { opacity:.86; }
.radar-nav {
  position:sticky; top:0; z-index:9999;
  display:flex; flex-wrap:wrap; gap:8px;
  padding:12px 16px; margin:0;
  background:rgba(255,255,255,.97);
  border-bottom:1px solid #d9e0e8;
  box-shadow:0 5px 18px rgba(15,23,42,.08);
  backdrop-filter:blur(10px);
}
.radar-tab {
  border:1px solid #dce3eb; background:#f3f6fa; color:#40516a;
  border-radius:12px; padding:10px 14px; font-weight:750;
  cursor:pointer; text-decoration:none; display:inline-flex; align-items:center;
  min-height:40px; transition:.16s ease;
}
.radar-tab:hover { background:#fff; transform:translateY(-1px); }
.radar-tab.active { color:#fff; background:linear-gradient(135deg,#18316b,#2864e6); border-color:#2258d3; box-shadow:0 5px 15px rgba(37,99,235,.22); }
.radar-section { display:none; max-width:1600px; margin:auto; padding:24px 22px 50px; scroll-margin-top:88px; }
.radar-section.active { display:block; }

  max-width:900px;margin:70px auto;padding:24px;border-radius:16px;
  background:#fff1f2;border:1px solid #fecdd3;color:#881337;

.radar-meta {
  display:flex; flex-wrap:wrap; gap:10px; margin:12px 0 18px;
}
.radar-meta span {
  background:#fff;border:1px solid #e1e7ee;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700;color:#526276;
}
.radar-delta-up { color:#15803d !important; }
.radar-delta-down { color:#b91c1c !important; }
@media(max-width:800px) {
  .radar-nav { overflow-x:auto; flex-wrap:nowrap; }

<body>
<header class="radar-shell-header">
  <h1>Adriatic New Build Radar</h1>
  <div class="sub">FULL INVENTORY • Project → Unit → Listing • NEW ≤30D • Price History • Data-driven V2</div>
</header>

<nav id="radar-nav" class="radar-nav" aria-label="Radar sections"></nav>
<div id="radar-meta" class="radar-meta" style="padding:10px 18px;margin:0;"></div>
<main id="radar-content">
  <div class="radar-loading"><b>Завантаження Radar data…</b><br>Читаю <code>data/current.json</code>.</div>
</main>

<script>
const DATA_URL = 'data/current.json';
const NAV = {"tab-overview": "Overview", "tab-live-full": "🔴 LIVE FULL INVENTORY", "tab-full-inventory": "FULL INVENTORY", "tab-jesolo": "Jesolo", "tab-caorle": "Caorle", "tab-cavallino": "Cavallino", "tab-san-dona": "San Donà", "tab-treviso": "Treviso", "tab-global-matrix": "Global Matrix", "tab-price-history": "Price History", "tab-planned": "Planned / Pipeline", "tab-jbc-source": "JBC Source", "tab-sources": "Sources"};

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

function renderNav(sections) {
  const nav=document.getElementById('radar-nav');
  nav.innerHTML='';
  sections.forEach(s=>{
    const a=document.createElement('a');
    a.className='radar-tab';
    a.href='#'+s.id;
    a.dataset.tab=s.id;
    a.textContent=s.label;
    a.addEventListener('click',e=>{
      e.preventDefault();
      activate(s.id,true);
    });
    nav.appendChild(a);
  });
}

function activate(id, updateHash) {
  document.querySelectorAll('.radar-section').forEach(s=>s.classList.toggle('active',s.id===id));
  document.querySelectorAll('.radar-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===id));
  if(updateHash) history.replaceState(null,'','#'+id);
  const target=document.getElementById(id);
  if(target) setTimeout(()=>target.scrollIntoView({block:'start',behavior:'smooth'}),0);
}

function renderMeta(data) {
  const m=document.getElementById('radar-meta');
  const vals=Object.entries(data.inventory_counts||{});
  const total=vals.reduce((a,[,v])=>a+(Number(v.portal_inventory)||0),0);
  m.innerHTML =
    `<span>Radar run: <b>${esc(data.run_date)}</b></span>`+
    `<span>Portal inventory total: <b>${total.toLocaleString('en-US')}</b></span>`+
    `<span>Locations: <b>${vals.length}</b></span>`+
    `<span>Data source: <b>data/current.json</b></span>`;
}


function addObjectLayerAudit(data) {
  const sec=document.getElementById('tab-full-inventory');
  if(!sec) return;
  const old=sec.querySelector('.radar-object-audit');
  if(old) old.remove();
  const box=document.createElement('div');
  box.className='radar-object-audit';
  box.style.cssText='margin:0 0 18px;padding:16px;border-radius:14px;background:#f6f7ff;border:1px solid #dfe3ff;';
  box.innerHTML=`<h3 style="margin-top:0">🧩 Project → Unit → Listing layer</h3>
  <p style="margin-top:0">Нижче відображається нормалізований object layer. Він окремий від portal inventory count: 388 результатів порталу не означають 388 унікальних проєктів.</p>
  <div id="radar-object-audit-table">Завантаження objects.json…</div>`;
  sec.insertBefore(box, sec.firstChild);
  fetch('data/objects.json?v='+Date.now(), {cache:'no-store'})
    .then(r=>{if(!r.ok) throw new Error('HTTP '+r.status); return r.json();})
    .then(o=>{
      let rows='';
      for(const [loc,n] of Object.entries(o.counts?.by_location||{})){
        rows += `<tr><td><b>${esc(loc)}</b></td><td>${Number(n).toLocaleString('en-US')}</td></tr>`;
      }
      document.getElementById('radar-object-audit-table').innerHTML=
        `<div class="tablewrap"><table><thead><tr><th>Location</th><th>Captured normalized listings</th></tr></thead><tbody>${rows}</tbody></table></div>
        <p style="font-size:12px;color:#64748b;margin-bottom:0">Current migrated layer: ${Number(o.counts?.total_captured_listings||0).toLocaleString('en-US')} concrete listings. Future runs will expand this layer from live sources.</p>`;
    })
    .catch(err=>{
      document.getElementById('radar-object-audit-table').textContent='objects.json: '+err.message;
    });
}

function addInventoryAudit(data) {
  // Adds live deltas to the FULL INVENTORY section without rewriting its stored HTML.
  const sec=document.getElementById('tab-full-inventory');
  if(!sec) return;
  const existing=sec.querySelector('.radar-v2-audit');
  if(existing) existing.remove();
  const box=document.createElement('div');
  box.className='radar-v2-audit';
  box.style.cssText='margin:0 0 18px;padding:16px;border-radius:14px;background:#eef6ff;border:1px solid #cfe0ff;';
  let rows='';
  for(const [loc,v] of Object.entries(data.inventory_counts||{})) {
    const prev=data.previous_snapshot?.inventory_counts?.[loc]?.portal_inventory;
    const cur=Number(v.portal_inventory)||0;
    const delta=(prev==null)?null:cur-Number(prev);
    let d=delta==null?'—':(delta>0?`+${delta}`:`${delta}`);
    rows+=`<tr><td><b>${esc(loc)}</b></td><td>${cur.toLocaleString('en-US')}</td><td>${Number(v.captured_concrete_rows||0)}</td><td class="${delta>0?'radar-delta-up':delta<0?'radar-delta-down':''}">${d}</td></tr>`;
  }
  box.innerHTML=`<h3 style="margin-top:0">🔄 Data-driven inventory audit</h3>
  <p style="margin-top:0">Ці цифри беруться з <code>data/current.json</code>. Наступний radar run змінить JSON — сайт покаже нові значення без редагування <code>index.html</code>.</p>
  <div class="tablewrap"><table><thead><tr><th>Location</th><th>Portal inventory</th><th>Captured rows</th><th>Δ vs previous</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  sec.insertBefore(box, sec.firstChild);
}

async function boot() {
  try {
    const res=await fetch(DATA_URL+'?v='+Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status+' while loading '+DATA_URL);
    const data=await res.json();

    renderNav(data.sections);
    const main=document.getElementById('radar-content');
    main.innerHTML='';
    data.sections.forEach(s=>{
      const sec=document.createElement('section');
      sec.id=s.id;
      sec.className='radar-section';
      sec.innerHTML=s.html;
      main.appendChild(sec);
    });
    renderMeta(data);
    addInventoryAudit(data);
    addObjectLayerAudit(data);

    const wanted=location.hash.replace('#','');
    const first=data.sections[0]?.id;
    activate(data.sections.some(s=>s.id===wanted)?wanted:first,false);
  } catch(err) {
    document.getElementById('radar-content').innerHTML=
      `<div class="radar-error"><h2>Radar data не завантажилися</h2>
      <p><b>${esc(err.message)}</b></p>
      <p>Перевір, що <code>data/current.json</code> знаходиться в репозиторії поруч із <code>index.html</code>.</p></div>`;
  }
}
window.addEventListener('hashchange',()=>{
  const id=location.hash.replace('#','');
  if(document.getElementById(id)) activate(id,false);
});
boot();
</script>
</body>
</html>
