<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adriatic New Build Radar</title><style>
:root{--navy:#17243b;--blue:#2458c6;--bg:#f2f5f9;--card:#fff;--text:#1d2a3d;--muted:#66758a;--line:#dce4ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{background:var(--navy);color:#fff;padding:34px 28px}header h1{margin:0;font-size:34px}header .sub{margin-top:10px;font-size:16px;opacity:.9}nav{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;box-shadow:0 2px 10px #0001}.tab{border:1px solid var(--line);background:#f7f9fc;color:#42546e;border-radius:18px;padding:10px 15px;font-weight:700;cursor:pointer}.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}main{max-width:1800px;margin:auto;padding:18px}.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.pill{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;color:#53647c}section{display:none}.section-active{display:block}h2{font-size:30px;margin:20px 0}h3{margin-top:25px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card,.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 3px 14px #00000008}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:16px 0}.stats>div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.stats small{display:block;color:var(--muted)}.stats b{font-size:27px;display:block;margin-top:4px}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;margin:12px 0}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#f7f9fc;position:sticky;top:0}a{color:#1457b7}.tag{display:inline-block;background:#eaf0ff;color:#234ca8;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800}.good,.note,.error{padding:15px 17px;border-radius:12px;margin:14px 0}.good{background:#e9f7ed;border-left:4px solid #2d8a4b}.note{background:#fff7dc;border-left:4px solid #d6a600}.error{background:#fff0f2;border-left:4px solid #c03955}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.controls input,.controls select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}.delta-down{color:#0a7a39;font-weight:800}.delta-up{color:#b42318;font-weight:800}.muted{color:var(--muted)}.small{font-size:13px;color:var(--muted)}.loading{padding:40px;text-align:center}@media(max-width:700px){header{padding:24px 18px}header h1{font-size:27px}.tab{padding:9px 11px}main{padding:10px}}
</style></head><body><header><h1>Adriatic New Build Radar</h1><div class="sub">FULL INVENTORY · Project → Unit → Listing · NEW ≤30D · Price History · Data-driven V3</div></header><nav id="tabs"></nav><main><div id="meta" class="meta"></div><div id="app"><div class="loading">Завантаження radar data…</div></div></main><script>
(()=>{'use strict';const U={c:'data/current.json',o:'data/objects.json',h:'data/price_history.json'},S={current:null,objects:[],history:null};const $=(s,r=document)=>r.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>Number.isFinite(Number(v))?new Intl.NumberFormat('en-US',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(v)):'—',num=v=>Number.isFinite(Number(v))?new Intl.NumberFormat('en-US').format(Number(v)):'—',df=v=>{if(!v)return'—';let d=new Date(v);return Number.isNaN(d.getTime())?esc(v):new Intl.DateTimeFormat('uk-UA',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d)},delta=v=>v==null||v===''?'<span class="muted">—</span>':`<span class="${Number(v)<0?'delta-down':Number(v)>0?'delta-up':'muted'}">${money(v)}</span>`;
async function get(u){let r=await fetch(u+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(u+': HTTP '+r.status);return r.json()}
function meta(){let c=S.current||{},loc=[...new Set(S.objects.map(o=>o.location).filter(Boolean))];$('#meta').innerHTML=`<span class="pill">Radar run: ${esc(df(c.run_date))}</span><span class="pill">Portal inventory total: ${num(c.portal_inventory_total)}</span><span class="pill">Live capture: ${num(c.live_capture_total)}</span><span class="pill">Locations: ${num(loc.length)}</span><span class="pill">Last live capture: ${esc(c.last_live_capture||'—')}</span>`}
function overview(){let c=S.current||{},p=S.objects.filter(o=>Number.isFinite(Number(o.price))),n=S.objects.filter(o=>o.new_to_radar_30d),d=S.objects.filter(o=>o.discount_signal);return `<h2>Executive Radar — ${esc(df(c.run_date))}</h2><div class="stats"><div><small>Locations</small><b>${new Set(S.objects.map(o=>o.location).filter(Boolean)).size}</b></div><div><small>Priced objects</small><b>${num(p.length)}</b></div><div><small>Budget target</small><b>≤ €400k</b></div><div><small>NEW ≤30D</small><b>${num(n.length)}</b></div><div><small>Discount signals</small><b>${num((c.price_history_stats||{}).discount_signals??d.length)}</b></div><div><small>History retention</small><b>365 days</b></div></div><div class="good"><b>Radar data loaded successfully.</b> Дата береться з <code>data/current.json</code>, а не захардкоджена в HTML.</div><h3>🔥 Current priced objects</h3>${cards(p)}<h3>📉 Price changes</h3>${changeTable(p.filter(o=>o.price_delta!=null||o.price_change_30d!=null||o.price_change_180d!=null))}`}
function cards(a){let x=[...a].sort((x,y)=>(x.price||Infinity)-(y.price||Infinity)).slice(0,12);return x.length?`<div class="grid">${x.map(o=>`<div class="card"><span class="tag">${esc((o.location||'').toUpperCase())}</span><h3>${esc(o.listing_title||'Object')}</h3><div style="font-size:24px;font-weight:800">${money(o.price)}</div><div>${o.area_m2??'—'} m² · ${o.eur_m2?money(o.eur_m2):'—'}/m²</div><p>${o.new_to_radar_30d?'🆕 NEW ≤30D · ':''}${o.discount_signal?'🏷️ DISCOUNT SIGNAL · ':''}${esc(o.source||'')}</p><a href="${esc(o.source_url)}" target="_blank" rel="noopener noreferrer">Open source ↗</a></div>`).join('')}</div>`:'<div class="note">Немає об’єктів із числовою ціною.</div>'}
function changeTable(a){if(!a.length)return'<div class="note">Ще немає достатньої історії для дельт.</div>';return `<div class="tablewrap"><table><thead><tr><th>Object</th><th>Price</th><th>Δ prev</th><th>Δ ~30D</th><th>Δ ~180D</th><th>Discount</th></tr></thead><tbody>${a.map(o=>`<tr><td><a href="${esc(o.source_url)}" target="_blank" rel="noopener noreferrer">${esc(o.listing_title||'Object')}</a></td><td>${money(o.price)}</td><td>${delta(o.price_delta)}</td><td>${delta(o.price_change_30d)}</td><td>${delta(o.price_change_180d)}</td><td>${o.discount_signal?'🏷️ '+esc((o.discount_keywords||[]).join(', ')||'DISCOUNT'):'—'}</td></tr>`).join('')}</tbody></table></div>`}
function objectTable(){return `<div class="controls"><input id="os" placeholder="Пошук об’єкта / локації…"><select id="of"><option value="all">Всі</option><option value="discount">Discount</option><option value="down">Price down</option><option value="new">NEW ≤30D</option></select></div><div class="tablewrap"><table id="ot"><thead><tr><th>Location</th><th>Object / source</th><th>Price</th><th>m²</th><th>€/m²</th><th>Δ prev</th><th>Δ ~30D</th><th>Δ ~180D</th><th>Discount</th><th>NEW</th></tr></thead><tbody>${S.objects.map(o=>`<tr><td>${esc(o.location)}</td><td><a href="${esc(o.source_url)}" target="_blank" rel="noopener noreferrer">${esc(o.listing_title||'Open listing')}</a></td><td>${money(o.price)}</td><td>${o.area_m2??'—'}</td><td>${o.eur_m2?money(o.eur_m2):'—'}</td><td>${delta(o.price_delta)}</td><td>${delta(o.price_change_30d)}</td><td>${delta(o.price_change_180d)}</td><td>${o.discount_signal?'🏷️ '+esc((o.discount_keywords||[]).join(', ')||'DISCOUNT'):'—'}</td><td>${o.new_to_radar_30d?'🆕':''}</td></tr>`).join('')}</tbody></table></div>`}
function history(){let rows=[];for(let [url,a] of Object.entries(S.history?.listings||{})){if(!Array.isArray(a)||!a.length)continue;let s=[...a].sort((x,y)=>String(x.date).localeCompare(String(y.date))),l=s.at(-1),p=s.at(-2);rows.push({url,title:l.listing_title||url,l,p,dp:p&&l.price!=null&&p.price!=null?l.price-p.price:null})}return `<h2>Global Price History / Deltas</h2><div class="good"><b>Object-level price history.</b> Кожен щоденний snapshot зберігає dated price. Реальна знижка визначається порівнянням snapshot; слова ribassato/occasione/sconto фіксуються окремо як signal.</div><div class="stats"><div><small>Tracked listings</small><b>${rows.length}</b></div><div><small>Decreases vs previous</small><b>${rows.filter(r=>(r.dp??0)<0).length}</b></div><div><small>Increases vs previous</small><b>${rows.filter(r=>(r.dp??0)>0).length}</b></div></div><div class="tablewrap"><table id="ht"><thead><tr><th>Object</th><th>Latest</th><th>Previous snapshot</th><th>Δ prev</th><th>History</th></tr></thead><tbody>${rows.map(r=>`<tr><td><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)}</a></td><td><b>${money(r.l.price)}</b><br><span class="small">${esc(df(r.l.date))}</span></td><td>${r.p?money(r.p.price)+'<br><span class="small">'+esc(df(r.p.date))+'</span>':'—'}</td><td>${delta(r.dp)}</td><td>${r.p?money(r.p.price)+' → '+money(r.l.price):'1 snapshot'}</td></tr>`).join('')}</tbody></table></div><div class="note">30-day та 180-day baselines з’являтимуться автоматично після накопичення відповідної історії.</div>`}
function render(){
  let c=S.current||{}, sections=Array.isArray(c.sections)?c.sections:[];
  const norm=v=>String(v??'').trim().toLowerCase().replace(/[^a-zа-яіїєґ0-9]+/gi,' ');
  const wanted=[
    ['overview','Overview'],
    ['live','🔴 LIVE FULL INVENTORY'],
    ['full','FULL INVENTORY'],
    ['price','Price History'],
    ['planned','Planned / Pipeline'],
    ['jbc','JBC Source'],
    ['sources','Sources'],
    ['jesolo','Jesolo'],
    ['caorle','Caorle'],
    ['cavallino','Cavallino'],
    ['san dona','San Donà'],
    ['treviso','Treviso'],
    ['global matrix','Global Matrix']
  ];
  const aliases={
    'planned / pipeline':['planned pipeline','planned / pipeline','pipeline','planned'],
    'jbc source':['jbc source','jbc'],
    'sources':['sources','source'],
    'san dona':['san dona','san donà','sandonà'],
    'global matrix':['global matrix','matrix'],
    'full':['full inventory','all objects','all object'],
    'price':['price history','price'],
    'live':['live full inventory','live inventory']
  };
  const used=new Set();
  function matches(sec,key){
    const label=norm(sec.label||sec.title||'');
    if(key==='overview') return false;
    const a=aliases[key]||[key];
    return a.some(x=>label===norm(x)||label.includes(norm(x)));
  }
  function take(key){
    const idx=sections.findIndex((s,i)=>!used.has(i)&&matches(s,key));
    if(idx<0)return null;
    used.add(idx); return sections[idx];
  }
  const tabs=[];
  tabs.push({id:'overview',label:'Overview',html:overview()});
  tabs.push({id:'live',label:'🔴 LIVE FULL INVENTORY',html:'<h2>🔴 LIVE FULL INVENTORY</h2>'+objectTable()});
  tabs.push({id:'full',label:'FULL INVENTORY',html:'<h2>FULL INVENTORY</h2>'+objectTable()});
  tabs.push({id:'price',label:'Price History',html:history()});
  for(const key of ['planned','jbc','sources']){
    const s=take(key); if(s) tabs.push({id:key,label:wanted.find(x=>x[0]===key)?.[1]||s.label||s.title,html:s.html||''});
  }
  for(const key of ['jesolo','caorle','cavallino','san dona','treviso','global matrix']){
    const s=take(key); if(s) tabs.push({id:key.replace(/\s+/g,'-'),label:wanted.find(x=>x[0]===key)?.[1]||s.label||s.title,html:s.html||''});
  }
  // Any remaining sections are retained, but duplicate labels are removed.
  const shownLabels=new Set(tabs.map(t=>norm(t.label)));
  sections.forEach((s,i)=>{
    if(used.has(i))return;
    const label=s.label||s.title||'';
    const n=norm(label);
    if(!label||shownLabels.has(n))return;
    shownLabels.add(n);
    tabs.push({id:'extra-'+i,label,html:s.html||''});
  });
  $('#tabs').innerHTML=tabs.map((t,i)=>`<button type="button" class="tab ${i===0?'active':''}" data-s="${esc(t.id)}">${esc(t.label)}</button>`).join('');
  $('#app').innerHTML=tabs.map((t,i)=>`<section id="sec-${esc(t.id)}" class="${i===0?'section-active':''}">${t.html}</section>`).join('');
}
function events(){$('#tabs').addEventListener('click',e=>{let b=e.target.closest('[data-s]');if(!b)return;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('main section').forEach(x=>x.classList.remove('section-active'));let t=document.getElementById('sec-'+b.dataset.s);if(t)t.classList.add('section-active')});document.addEventListener('input',e=>{if(e.target.id!=='os')return;let q=e.target.value.toLowerCase();document.querySelectorAll('#ot tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')});document.addEventListener('change',e=>{if(e.target.id!=='of')return;let f=e.target.value;document.querySelectorAll('#ot tbody tr').forEach(r=>{let x=r.innerText.toLowerCase();let ok=f==='all'||(f==='discount'&&x.includes('discount'))||(f==='down'&&x.includes('-€'))||(f==='new'&&x.includes('🆕'));r.style.display=ok?'':'none'})})}
async function init(){events();try{[S.current,S.objects,S.history]=await Promise.all([get(U.c),get(U.o),get(U.h)]);S.objects=Array.isArray(S.objects.objects)?S.objects.objects:[];meta();render();document.title='Adriatic New Build Radar — '+(S.current.run_date||'')}catch(e){console.error(e);$('#app').innerHTML='<div class="error"><h2>Radar data не завантажилися</h2><b>'+esc(e.message)+'</b><p>Перевір data/current.json, data/objects.json та data/price_history.json.</p></div>'}}init()})();
</script></body></html>
