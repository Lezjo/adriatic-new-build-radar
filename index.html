<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adriatic New Build Radar</title><style>:root{--n:#17243b;--b:#2458c6;--bg:#f3f6fa;--line:#dce4ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui;color:#1d2a3d}header{padding:28px;background:var(--n);color:#fff}h1{margin:0}nav{padding:10px;display:flex;gap:6px;flex-wrap:wrap;background:#fff;position:sticky;top:0}.tab{border:1px solid var(--line);padding:8px 11px;border-radius:14px;background:#fff;cursor:pointer}.tab.active{background:var(--b);color:#fff}main{max-width:1600px;margin:auto;padding:18px}.grid,.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.card,.stat,.table{padding:15px;border:1px solid var(--line);background:#fff;border-radius:12px}.stat b{display:block;font-size:26px}.table{overflow:auto;margin-top:12px}table{width:100%;border-collapse:collapse;min-width:700px}td,th{padding:9px;border-bottom:1px solid var(--line);text-align:left}.up{color:#aa241b}.down{color:#08783c}.warn{background:#fff5d8;border-left:4px solid #dfae00;padding:12px}.bad{background:#fff0f0;border-left:4px solid #c33;padding:12px}section{display:none}.show{display:block}a{color:#1457b7}.muted{color:#66758a}</style></head><body><header><h1>Adriatic New Build Radar</h1><div id="subtitle">Loading current verified inventory…</div></header><nav id="nav"></nav><main><div id="meta" class="stats"></div><div id="app"></div></main><script>
(()=>{const $=s=>document.querySelector(s),E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),M=x=>Number.isFinite(+x)?new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(x):'—',N=x=>Number.isFinite(+x)?new Intl.NumberFormat('uk-UA').format(x):'—',D=x=>x?new Intl.DateTimeFormat('uk-UA',{dateStyle:'medium',timeStyle:'short'}).format(new Date(x)):'—';let S={};async function get(x){let r=await fetch(x+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(x+' '+r.status);return r.json()};
function table(rows,cols){return rows.length?`<div class="table"><table><thead><tr>${cols.map(x=>'<th>'+x[0]+'</th>').join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+cols.map(x=>'<td>'+x[1](r)+'</td>').join('')+'</tr>').join('')}</tbody></table></div>`:'<p class="warn">Немає записів для цього зрізу.</p>'};function listingTable(rows=S.objects){return table(rows,[['Location',x=>E(x.location)],['Listing',x=>`<a target="_blank" rel="noopener" href="${E(x.source_url)}">${E(x.listing_title)}</a>`],['Source',x=>E(x.source)],['Price',x=>M(x.price)],['m²',x=>N(x.area_m2)],['€/m²',x=>M(x.eur_m2)],['Δ latest',x=>x.price_delta==null?'—':`<span class="${x.price_delta<0?'down':'up'}">${M(x.price_delta)} (${x.price_delta_pct??'—'}%)</span>`]])};
function overview(){let c=S.current,t=c.totals||{},m=c.source_metrics||[],bad=m.filter(x=>x.mandatory&&x.enabled&&x.status!=='SUCCESS');return `<h2>Overview</h2><div class="stats">${[['Snapshot',c.snapshot_status],['Listings',t.listings],['Projects',t.projects],['Units',t.units],['Rejected',t.rejected],['Sources healthy',m.filter(x=>x.status==='SUCCESS').length],['Sources degraded',m.filter(x=>x.enabled&&x.status!=='SUCCESS').length]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${N(x[1])}</b></div>`).join('')}</div>${bad.length?`<p class="bad">Не «Full inventory»: ${bad.length} обов’язкових source runs не дали успішних published rows. Перевірте Sources / Audit.</p>`:'<p class="warn">Статус залежить від останнього фактичного manifest.</p>'}<h3>Latest listings</h3>${listingTable()}`};
function source(){return `<h2>Sources / coverage</h2>${table(S.current.source_metrics||[],[['Source',x=>E(x.source_name)],['Location',x=>E(x.location)],['Mandatory',x=>x.mandatory?'yes':'no'],['Enabled',x=>x.enabled?'yes':'no'],['Seen',x=>N(x.discovered)],['Published',x=>N(x.accepted)],['Status',x=>E(x.status)],['Captured',x=>D(x.last_capture)]])}`};
function locations(){return `<h2>All locations from Першоджерело</h2><p class="muted">Coverage registry; an empty location is shown rather than hidden.</p><div class="grid">${S.locations.locations.map(x=>`<div class="card"><b>${E(x.comune)}</b><p>${E(x.cluster)}</p><small>${x.micro_locations.map(E).join(' · ')}</small><p>${N(S.objects.filter(o=>o.location===x.comune).length)} live listings</p></div>`).join('')}</div>`};
function prices(){let rows=S.objects.filter(x=>x.price_event||x.promotion);return `<h2>Price History & Promotions</h2><p class="muted">Deltas are calculated only from immutable observations keyed by source listing ID. A keyword promotion remains separate from a price decrease.</p>${table(rows,[['Listing',x=>`<a href="${E(x.source_url)}" target="_blank">${E(x.listing_title)}</a>`],['Event',x=>E(x.price_event)],['Current',x=>M(x.price)],['Previous',x=>M(x.previous_price)],['30D',x=>M(x.price_change_30d)],['90D',x=>M(x.price_change_90d)],['180D',x=>M(x.price_change_180d)],['365D',x=>M(x.price_change_365d)],['Promotion',x=>x.promotion?E(x.promotion.promotion_type):'—']])}`};
function locationInventory(){return `<h2>Live Inventory</h2><p class="muted">All published source listings; exact URL duplicates are removed only within the same source.</p>${listingTable()}`};function simple(name,key){let rows=S[key]?.[key]||[];return `<h2>${name}</h2>${table(rows,[['ID',x=>E(x[key.slice(0,-1)+'_id']||x.project_id||x.unit_id)],['Name / location',x=>E(x.project_name||x.title||x.location||'—')],['Listings',x=>N((x.listing_ids||[]).length)]])}`};
function audit(){let m=S.current.source_metrics||[];return `<h2>Audit</h2><p>Run: <code>${E(S.current.run_id)}</code>; generated: ${D(S.current.last_live_capture)}.</p><ul><li>Raw evidence: ${E(S.current.files?.manifest||'not available')}</li><li>All observed URLs retained per listing: ${S.objects.filter(x=>Array.isArray(x.observed_urls)&&x.observed_urls.length).length}/${S.objects.length}</li><li>Provenance retained: ${S.objects.filter(x=>x.source_id&&x.raw_reference).length}/${S.objects.length}</li><li>Location registry entries: ${S.locations.locations.length}</li></ul>${source()}`};
function render(){let tabs=[['overview','Overview',overview],['live','Live Inventory',locationInventory],['projects','Projects',()=>simple('Projects','projects')],['units','Units',()=>simple('Units','units')],['new','New / Last 30D',()=>listingTable(S.objects.filter(x=>x.new_to_radar_30d))],['prices','Price History',prices],['promos','Promotions',()=>listingTable(S.objects.filter(x=>x.promotion))],['planned','Planned / Pipeline',()=>'<h2>Planned / Pipeline</h2><p class="warn">Official planning sources are registered but do not yet have verified adapters; no planning data is manufactured.</p>'],['locations','Location Matrix',locations],['family','Family / Living',()=>'<h2>Family / Living</h2><p class="warn">Scores require verified school, health, mobility and winter-service data. They are deliberately not inferred from listings.</p>'],['rental','Rental',()=>'<h2>Rental</h2><p class="warn">Rental/yield data needs a separate verified rental evidence layer.</p>'],['investment','Investment',()=>'<h2>Investment</h2><p class="warn">No investment score is calculated until valuation, costs and risk inputs are present.</p>'],['risk','Risk',()=>'<h2>Risk</h2><p class="warn">Flood/coastal risk requires official GIS evidence and is not guessed.</p>'],['sources','Sources',source],['audit','Audit',audit]];$('#nav').innerHTML=tabs.map((x,i)=>`<button class="tab ${i?'':'active'}" data-id="${x[0]}">${x[1]}</button>`).join('');$('#app').innerHTML=tabs.map((x,i)=>`<section id="${x[0]}" class="${i?'':'show'}">${x[2]()}</section>`).join('');$('#nav').onclick=e=>{let b=e.target.closest('[data-id]');if(!b)return;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('section').forEach(x=>x.classList.toggle('show',x.id===b.dataset.id))}};
async function init(){try{let a=await Promise.all(['data/current.json','data/objects.json','data/projects.json','data/units.json','data/locations.json'].map(get));[S.current,S.objects,S.projects,S.units,S.locations]=a;S.objects=S.objects.objects||[];$('#subtitle').textContent=`Run ${S.current.run_id||'—'} · ${S.current.snapshot_status||'UNKNOWN'} · ${S.objects.length} published listings`;$('#meta').innerHTML=`<div class="stat">Run date<b>${D(S.current.last_live_capture)}</b></div><div class="stat">Locations<b>${N(S.locations.locations.length)}</b></div><div class="stat">Published listings<b>${N(S.objects.length)}</b></div>`;render()}catch(e){$('#app').innerHTML='<p class="bad">Data loading failed: '+E(e.message)+'</p>'}}init()})();
</script></body></html>
