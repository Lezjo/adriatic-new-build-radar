name: Adriatic Radar Snapshot

on:
  workflow_dispatch:
  schedule:
    # Every day at 06:00 UTC = 08:00 Italy during summer time.
    - cron: "0 6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: radar/requirements.txt

      - name: Prepare diagnostics
        run: |
          mkdir -p data/debug
          printf 'Radar run started: %s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > data/debug/run-info.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f radar/requirements.txt ]; then
            python -m pip install -r radar/requirements.txt
          fi

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium

      - name: Run radar snapshot pipeline
        run: |
          python -m radar.snapshot

      - name: Print capture diagnostics to log
        if: always()
        run: |
          echo "===== RADAR DEBUG DIRECTORY ====="
          if [ -d data/debug ]; then
            find data/debug -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          else
            echo "data/debug does not exist"
          fi

          echo "===== capture_debug.json ====="
          if [ -f data/debug/capture_debug.json ]; then
            cat data/debug/capture_debug.json
          else
            echo "capture_debug.json NOT FOUND"
          fi

          echo "===== DATA DIRECTORY ====="
          find data -maxdepth 2 -type f -printf '%p %s bytes\n' 2>/dev/null | sort | head -200 || true

      - name: Upload capture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-capture-diagnostics-${{ github.run_number }}
          path: |
            data/debug/
            data/history/*FAILED*.json
            data/history/*EMPTY*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Clean Python cache
        if: always()
        run: |
          find radar -type d -name "__pycache__" -prune -exec rm -rf {} +
          find . -type f \( -name "*.pyc" -o -name "*.pyo" \) -delete

      - name: Commit snapshot
        if: success()
        run: |
          git config user.name "adriatic-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ radar/

          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "radar: snapshot $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
